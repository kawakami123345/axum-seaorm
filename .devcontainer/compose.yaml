name: axum-seaorm-dev

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:1-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/project
      # Keep build output and dependencies off the host bind mount.
      - type: volume
        source: rust_target
        target: /workspaces/project/target
        volume:
          nocopy: true
      - type: volume
        source: frontend_node_modules
        target: /workspaces/project/web/node_modules
        volume:
          nocopy: true
      - type: volume
        source: cargo_registry
        target: /home/vscode/.cargo/registry
        volume:
          nocopy: true
      - type: volume
        source: cargo_git
        target: /home/vscode/.cargo/git
        volume:
          nocopy: true
    # Keep the browser and API on the same localhost OIDC issuer URL.
    network_mode: service:keycloak
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rust_web_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rust_web_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-ec",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  rust_target:
  frontend_node_modules:
  cargo_registry:
  cargo_git:
  postgres_data:
  keycloak_data:
